<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Formateur IA (Anam.ai)</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins',sans-serif;
    }

    .card {
        background: white;
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 10px 25px rgba(0,0,0,.05);
    }

    h1 {
        color: #fff;
        font-size: 30px;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #d1d5db;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin: 15px 0 8px;
        font-weight: 600;
        color: #555;
    }

    input {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #ddd;
        outline: none;
    }

    button {
        background: linear-gradient(90deg,#ff6ea8,#ff8b6a);
        border: none;
        color: white;
        border-radius: 15px;
        padding: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: .3s;
    }

        button:hover {
            transform: scale(1.03);
        }
    body {
        margin: 0;
        background: linear-gradient(135deg,#fff7f9,#ffeef6,#fff4fb);
        font-family: Poppins,sans-serif;
    }

    .container {
        width: 96%;
        height: 96vh;
        margin: 2vh auto;
        display: grid;
        grid-template-columns: 330px 1fr;
        gap: 25px;
        background: white;
        border-radius: 35px;
        padding: 22px;
        box-shadow: 0 20px 60px rgba(244,114,182,.15);
    }

    .left-panel {
        background: #fff8fb;
        border-radius: 28px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .right-panel {
        display: flex;
    }

    .video-card {
        flex: 1;
        background: white;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,.10);
    }

    .video-header {
        height: 65px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(90deg,#ff6ea8,#ff8b6a);
        color: white;
        font-size: 24px;
        font-weight: bold;
    }

    #avatar-video {
        width: 100%;
        height: calc(100vh - 170px);
        object-fit: contain;
        background: #ffeef5;
        border-radius: 0 0 25px 25px;
    }

    .status {
        padding: 18px;
        border-radius: 15px;
        background: #fff7ed;
        color: #c2410c;
        border-left: 6px solid #fb923c;
    }

    @media(max-width:1000px) {

        .container {
            grid-template-columns: 1fr;
            height: auto;
        }

        #avatar-video {
            height: 500px;
        }
    }
</style>
</head>
<body>

    <div class="container">

        <div class="left-panel">

            <h1>🤖 Formateur IA</h1>

            <p class="subtitle">
                Plateforme d'interaction avec votre Avatar IA
            </p>

            <div class="card">

                <h3>🔐 Connexion</h3>

                <label>Email</label>
                <input id="email" placeholder="Votre email">

                <label>Mot de passe</label>
                <input id="password"
                       type="password"
                       placeholder="********">

                <button onclick="login()">
                    Se connecter
                </button>

            </div>

            <div class="card">

                <h3>🎓 Session Avatar</h3>

                <label>ID Formateur</label>
                <input id="formateurId"
                       type="number"
                       value="1">

                <label>ID Module</label>
                <input id="moduleId"
                       type="number"
                       value="1">

                <button onclick="demarrerSession()">
                    Démarrer l'avatar
                </button>

            </div>

            <div id="status" class="status">
                ⏳ Non connecté.
            </div>

        </div>

        <div class="right-panel">

            <div class="video-card">

                <div class="video-header">
                    <h2>🎥 Avatar IA</h2>
                </div>

                <video id="avatar-video"
                       autoplay
                       playsinline>
                </video>

            </div>

        </div>

    </div>


    <script type="module">
        import { createClient } from "https://esm.sh/@anam-ai/js-sdk@latest";

        let jwtToken = null;
        let anamClient = null;

        window.login = async function () {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            });

            if (!res.ok) {
                document.getElementById("status").innerText = "❌ Connexion échouée.";
                return;
            }

            const data = await res.json();

            jwtToken = data.token;

            document.getElementById("status").innerText =
                "✅ Connecté en tant que " + data.nom;

        };

        window.demarrerSession = async function () {

            if (!jwtToken) {

                document.getElementById("status").innerText =
                    "⚠ Connectez-vous d'abord.";

                return;
            }

            const formateurId =
                parseInt(document.getElementById("formateurId").value);

            const moduleFormationId =
                parseInt(document.getElementById("moduleId").value);

            document.getElementById("status").innerText =
                "⏳ Démarrage de l'avatar...";

            const res = await fetch("/api/avatar/session", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${jwtToken}`
                },

                body: JSON.stringify({
                    formateurId,
                    moduleFormationId
                })

            });

            if (!res.ok) {

                const err = await res.json().catch(() => ({}));

                document.getElementById("status").innerText =
                    "❌ " + (err.message || res.statusText);

                return;

            }

            const { sessionToken } = await res.json();

            anamClient = createClient(sessionToken);

            await anamClient.streamToVideoElement("avatar-video");

            document.getElementById("status").innerText =
                "🎤 Avatar connecté, vous pouvez commencer à parler.";

        };
    </script>

</body>
